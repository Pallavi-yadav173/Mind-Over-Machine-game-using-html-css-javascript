<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mind Over Machine</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- AURUM Style Font -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:black;
  font-family:'Cinzel', serif;
}

/* Fullscreen video */
video{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* Dark cinematic overlay */
.overlay{
  position:absolute;
  width:100%;
  height:100%;
  background:
    linear-gradient(to bottom,
    rgba(0,0,0,0.7),
    rgba(0,0,0,0.4),
    rgba(0,0,0,0.8));
}

/* Golden particles glow */
.overlay::before{
  content:"";
  position:absolute;
  inset:0;
  background:
  radial-gradient(circle at center,
  rgba(255,215,0,0.08),
  transparent 70%);
}

/* Main title */
.title{
  position:absolute;
  top:18%;
  width:100%;
  text-align:center;
  color:#f8d66d;
  font-size:64px;
  letter-spacing:8px;
  text-transform:uppercase;

  text-shadow:
    0 0 10px #ffd700,
    0 0 25px #ffcc00,
    0 0 45px rgba(255,215,0,0.8);

  animation: glow 2s infinite alternate;
}

/* Subtitle */
.subtitle{
  position:absolute;
  top:33%;
  width:100%;
  text-align:center;
  color:#d6b85a;
  font-size:18px;
  letter-spacing:4px;
  opacity:0.9;
}

/* Start button */
.start-btn{
  position:absolute;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  
  padding:16px 45px;
  
  font-size:18px;
  font-family:'Cinzel', serif;
  font-weight:700;
  letter-spacing:3px;
  
  color:black;
  
  border:none;
  border-radius:12px;

  background:linear-gradient(135deg,#f8d66d,#ffb300);

  cursor:pointer;

  box-shadow:
    0 0 10px #ffd700,
    0 0 25px rgba(255,215,0,0.7);

  transition:0.4s;
}

/* Hover effect */
.start-btn:hover{
  transform:translateX(-50%) scale(1.08);

  box-shadow:
    0 0 20px #ffd700,
    0 0 40px rgba(255,215,0,1);

  background:linear-gradient(135deg,#ffe38a,#ffcc00);
}

/* Title animation */
@keyframes glow{
  from{
    text-shadow:
      0 0 10px #ffd700,
      0 0 25px #ffcc00;
  }

  to{
    text-shadow:
      0 0 20px #fff3b0,
      0 0 45px #ffd700,
      0 0 70px #ffcc00;
  }
}

</style>
</head>

<body>

<!-- Background Video -->
<video id="endVideo" autoplay muted>
  <source src="/end.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- AURUM Style Title -->
<div class="title">MIND OVER MACHINE</div>

<div class="subtitle">
  You have completed the levels
</div>

<button class="start-btn" onclick="startGame()">
  Back to Main Menu
</button>

<script>

// Auto next after video ends
document.getElementById("endVideo").onended = function () {
  window.location.href = "/menu1";
};

// Start button
function startGame(){
  window.location.href = "/menu1";
}

</script>

</body>
</html>
